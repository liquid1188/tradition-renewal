name: Refresh Substack posts
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths: [scripts/fetch_posts.py]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/fetch_posts.py
      - name: Commit if changed
        run: |
          git config user.name "tradition-renewal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add posts.json
          git diff --cached --quiet || (git commit -m "Auto: refresh posts.json from Substack" && git push)
